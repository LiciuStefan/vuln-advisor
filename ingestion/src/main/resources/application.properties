spring.application.name=ingestion

# Baza de date proprie (advisor_ingestion)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/advisor_ingestion
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Workspace partajat (claim-check)
workspace.dir=${WORKSPACE_DIR:/workspace}
