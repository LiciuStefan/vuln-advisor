spring.application.name=matching

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/advisor_matching
spring.datasource.username=${DB_USER:advisor}
spring.datasource.password=${DB_PASSWORD:advisor}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

workspace.dir=${WORKSPACE_DIR:/workspace}
